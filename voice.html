(function(){

function shareVoice(){
  var shareData = {
    title: '游导学习笔记 - 备考经验锦囊',
    text: '过来人的真实经验，帮你少走弯路！走过弯路，所以更懂路',
    url: window.location.href
  };
  if(navigator.share){
    navigator.share(shareData).catch(function(){copyVoiceLink();});
  } else {
    copyVoiceLink();
  }
}

function copyVoiceLink(){
  var url = window.location.href;
  if(navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){
      showToastV('链接已复制');
    });
  } else {
    showToastV('请长按链接复制');
  }
}

function showToastV(msg){
  var toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:0.85rem;z-index:99999;opacity:0;transition:opacity 0.3s;';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(function(){ toast.style.opacity = '1'; }, 10);
  setTimeout(function(){ toast.style.opacity = '0'; setTimeout(function(){ document.body.removeChild(toast); }, 300); }, 2000);
}
</script>
