function scrollToBottom() {
    var msgContainer = document.getElementById('msgContainer') || document.querySelector('.messages');
    if (msgContainer) {
        msgContainer.scrollTop = msgContainer.scrollHeight;
    }
}

// 长消息折叠
function setupLongMsgCollapse() {
    var bubbles = document.querySelectorAll('.msg-bubble');
    bubbles.forEach(function(bubble) {
        if (bubble.scrollHeight > 300) {
            bubble.classList.add('long-msg');
            var btn = document.createElement('button');
            btn.className = 'expand-btn show';
            btn.textContent = '展开全部 ▼';
            btn.onclick = function() {
                bubble.classList.toggle('expand');
                btn.textContent = bubble.classList.contains('expand') ? '收起 ▲' : '展开全部 ▼';
            };
            bubble.parentNode.appendChild(btn);
        }
    });
}

// 消息添加后自动滚动
function onNewMessage() {
    scrollToBottom();
    // 延迟设置折叠按钮
    setTimeout(setupLongMsgCollapse, 100);
}

function renderMd(text){
  if(typeof marked !== 'undefined' && marked.parse){
    try{ return marked.parse(text); } catch(e){}
  }
  var s = escapeHtml(text);
  s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`(.*?)`/g, '<code>$1</code>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

                  fullText += data.content;
                }
                bubble.innerHTML = renderMd(fullText);
                msgContainer.scrollTop = msgContainer.scrollHeight;
              }
            }
          }
        } catch(e){}
      }
    }
    
    if(!fullText) {
      clearInterval(timerInterval);
      bubble.innerHTML = '<span style="color:#666666;">暂时无法回复，请稍后再试</span>';
    } else {
      clearInterval(timerInterval);
      var elapsed = Math.floor((Date.now() - botInfo.ts) / 1000);
      var timeTag = document.createElement('div');
      timeTag.className = 'timer';
      timeTag.style.marginTop = '8px';
      timeTag.innerHTML = '<span style="font-size:0.7rem;color:#616161">⏱ ' + elapsed + '秒</span>';
      bubble.appendChild(timeTag);
      
      var sourceTag = document.createElement('div');
      sourceTag.className = 'msg-source';
      sourceTag.textContent = '以上内容基于导游证考试知识库整理';
      bubble.appendChild(sourceTag);
      
      var followUps = generateFollowUps(fullText);
      if(followUps.length > 0) {
        var followDiv = document.createElement('div');
        followDiv.className = 'follow-ups';
        followUps.forEach(function(q) {
          var btn = document.createElement('button');
          btn.className = 'follow-btn';
          btn.textContent = q;
          btn.onclick = function(){ sendQuick(q); };
          followDiv.appendChild(btn);
        });
        bubble.appendChild(followDiv);
      }
      
      var actions = document.createElement('div');
      actions.className = 'msg-context-menu';
      actions.innerHTML = '<button class="ctx-btn" data-track="btn"  onclick="copyMsg(this)">复制</button><button class="ctx-btn" data-track="btn"  onclick="quoteMsg(this)">引用</button>';
      bubble.appendChild(actions);
      
      chatHistory.push({id: botInfo.div.id, role: 'bot', html: bubble.innerHTML, text: fullText});
      if(chatHistory.length > 100) chatHistory = chatHistory.slice(-80);
      try{ localStorage.setItem('youdao_chat_history', JSON.stringify(chatHistory)); localStorage.setItem('youdao_chat_conv', conversationId || ''); }catch(e){}
    }
  } catch(e) {
    clearInterval(timerInterval);
    bubble.innerHTML = '<span style="color:#666666;">发送失败，请重试</span>';
  }
  
  sendBtn.disabled = false;
  (document.getElementById('statusText')||{}).textContent= '在线 · 随时提问';
  inputEl.focus();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ===== 消息复制和引用功能 =====
var currentCtxMenu = null;
var longPressTimer = null;

// 复制消息内容
function copyMsg(btn) {
  var bubble = btn.closest('.msg-bubble');
  var text = bubble.textContent.replace(/复制|引用/g, '').trim();
  navigator.clipboard.writeText(text).then(function() {
    showToast('已复制');
  }).catch(function() {
    showToast('复制失败');
  });
  hideCtxMenu();
}

// 引用消息
function quoteMsg(btn) {
  var bubble = btn.closest('.msg-bubble');
  var msgs = bubble.closest('.msg');
  var msgId = msgs.id;
  var text = bubble.textContent.replace(/复制|引用/g, '').trim();
  
  // 找到对应的聊天记录
  var chatItem = chatHistory.find(function(c){ return c.id === msgId; });
  if (chatItem) {
    quoteTarget = {id: msgId, text: chatItem.text, role: chatItem.role};
    showQuoteHint(chatItem.text);
    document.getElementById('userInput').focus();
  }
  hideCtxMenu();
}

// 显示引用提示
function showQuoteHint(text) {
  var hint = document.getElementById('quoteHint');
  if (!hint) {
    hint = document.createElement('div');
    hint.id = 'quoteHint';
    hint.className = 'quote-hint';
    hint.innerHTML = '<span>引用: ...</span><button class="cancel-quote" onclick="cancelQuote()">×</button>';
    document.querySelector('.input-area').before(hint);
  }
  hint.querySelector('span').textContent = '引用: ' + text.substring(0,50) + (text.length > 50 ? '...' : '');
  hint.classList.add('show');
}

// 隐藏右键菜单
function hideCtxMenu() {
  document.querySelectorAll('.msg-context-menu').forEach(function(m){ m.classList.remove('show'); });
  currentCtxMenu = null;
}

// 显示Toast提示
function showToast(msg) {
  var toast = document.getElementById('ctxToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'ctxToast';
    toast.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.7);color:#fff;padding:10px 20px;border-radius:8px;font-size:0.9rem;z-index:10001;';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.display = 'block';
  setTimeout(function(){ toast.style.display = 'none'; }, 1500);
}

// 显示右键菜单
function showCtxMenu(bubble) {
  hideCtxMenu();
  var menu = bubble.querySelector('.msg-context-menu');
  if (menu) {
    menu.classList.add('show');
    currentCtxMenu = menu;
  }
}

// 初始化消息气泡的交互事件
function initMsgInteractions() {
  // PC端右键菜单
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.msg-bubble')) hideCtxMenu();
  });
  
  // 消息气泡点击显示菜单（手机友好）
  document.querySelectorAll('.msg-bubble').forEach(function(bubble) {
    // 长按显示菜单（500ms）
    bubble.addEventListener('touchstart', function(e) {
      longPressTimer = setTimeout(function() {
        showCtxMenu(bubble);
      }, 500);
    });
    bubble.addEventListener('touchend', function() {
      clearTimeout(longPressTimer);
    });
    bubble.addEventListener('touchmove', function() {
      clearTimeout(longPressTimer);
    });
    
    // PC端右键菜单
    bubble.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      showCtxMenu(bubble);
    });
    
    // 单击也显示菜单（手机友好）
    bubble.addEventListener('click', function(e) {
      if (!e.target.closest('button') && !e.target.closest('a') && !e.target.closest('img')) {
        showCtxMenu(bubble);
      }
    });
  });
}

// DOM加载后初始化
document.addEventListener('DOMContentLoaded', initMsgInteractions);

</script>

// Hook into chat to track free usage
document.addEventListener('DOMContentLoaded', function() {
  var chatBox = document.querySelector('[class*=chat]') || document.querySelector('[class*=message]') || document.querySelector('main');
  if (chatBox) {
    var observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(m) {
        m.addedNodes.forEach(function(node) {
          if (node.nodeType === 1 && typeof freeChatUsed === 'function') {
            // Check if this is an AI response (assistant message)
            var text = node.textContent || '';
            if (text.length > 20) {
              freeChatUsed();
            }
          }
        });
      });
    });
    observer.observe(chatBox, { childList: true, subtree: true });
  }
});
