  <script>
    (function() {
      const favorites = StudyProgress.getFavorites();
      const container = document.getElementById('favoritesContent');
      
      if (favorites.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⭐</div>
            <div class="empty-title">还没有收藏任何章节</div>
            <div class="empty-desc">在知识库中点击「收藏」按钮<br>即可将重要章节加入这里</div>
            <a href="travel-knowledge.html" class="empty-cta" data-track="cta" >去知识库看看 →</a>
          </div>
        `;
        return;
      }
      
      // 按分类整理
      const categories = {
        'business': { name: '💼 导游业务', items: [] },
        'policy': { name: '⚖️ 政策法规', items: [] },
        'national': { name: '📚 全国导基', items: [] },
        'local': { name: '🗺️ 地方导基', items: [] }
      };
      
      favorites.forEach(f => {
        const cat = f.id.split('-')[0];
        if (categories[cat]) {
          categories[cat].items.push(f);
        }
      });
      
      let html = `<div class="fav-section-title">共 ${favorites.length} 个收藏</div>`;
      
      Object.values(categories).forEach(cat => {
        if (cat.items.length > 0) {
          html += `
            <div class="fav-category">
              <div class="fav-category-name">${cat.name}</div>
              ${cat.items.map(item => `
                <div class="fav-item">
                  <div class="fav-item-left">
                    <a href="${item.url}" class="fav-item-title">${item.title}</a>
                    <div class="fav-item-date">收藏于 ${new Date(item.timestamp).toLocaleDateString()}</div>
                  </div>
                  <button class="fav-item-remove" onclick="removeFav('${item.id}')">取消</button>
                </div>
              `).join('')}
            </div>
          `;
        }
      });
      
      container.innerHTML = html;
    })();
    
    function removeFav(id) {
      StudyProgress.toggleFavorite(id, '', '');
      location.reload();
    }
  </script>
